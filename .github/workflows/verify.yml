name: Harmonic Compass

on:
  push:
    paths:
      - "2026-07-24/build-this-app-end-to-end/**"
  pull_request:
    paths:
      - "2026-07-24/build-this-app-end-to-end/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2026-07-24/build-this-app-end-to-end
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 2026-07-24/build-this-app-end-to-end/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmonic-compass-verification
          path: |
            2026-07-24/build-this-app-end-to-end/playwright-report
            2026-07-24/build-this-app-end-to-end/test-results
            2026-07-24/build-this-app-end-to-end/coverage
